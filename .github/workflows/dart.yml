# Static analysis CI for this Flutter app. Runs `flutter analyze` on each push.
# (The previous version used the bare Dart SDK + `dart test`, which always failed
# because this is a Flutter project with no test/ suite.)

name: CI

on:
  push:
    branches: ["mybranch", "main", "master"]
  pull_request:
    branches: ["mybranch", "main", "master"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze
